# purpose: the only ingress to php-fpm. Two jobs: serve Providence, and be the single
# choke point where identity can never arrive from the client.
server {
  listen 80;
  server_name _;
  root /var/www/providence;
  index index.php;

  client_max_body_size 2G;

  # The installer must not be reachable on a running instance. First install happens in
  # the entrypoint, not through the web UI.
  location ^~ /install { return 404; }

  # Providence stores originals under media/; only derivatives are meant to be public and
  # even those are not an access-control boundary. Serving this tree directly would hand
  # out originals to anyone who can guess a path.
  location ^~ /media/ { internal; alias /var/www/providence/media/; }

  location / { try_files $uri $uri/ /index.php?$query_string; }

  location ~ \.php$ {
    include fastcgi_params;
    fastcgi_pass app:9000;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_read_timeout 600;

    # SSO is NOT implemented here — see README "What this repo deliberately does not do".
    # These clears exist so that adding it later cannot accidentally inherit a
    # client-supplied identity: PHP maps `X-Bos-User` to HTTP_X_BOS_USER, so an
    # unset here is the difference between a gateway assertion and a forged one.
    # When the gateway lands, it sets these AFTER this block clears them.
    fastcgi_param HTTP_X_BOS_USER "";
    fastcgi_param HTTP_X_BOS_EMAIL "";
    fastcgi_param HTTP_X_BOS_FIRSTNAME "";
    fastcgi_param HTTP_X_BOS_LASTNAME "";
    fastcgi_param HTTP_X_BOS_ROLE "";
    fastcgi_param HTTP_REMOTE_USER "";
  }

  # No X-Frame-Options here on purpose: BOS does not embed this instance today, and a
  # stale XFO would silently defeat the embed lane when it arrives. Framing policy is
  # decided by the embed lane, not by this file. See README.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}
